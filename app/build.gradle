plugins {
    id 'com.android.application'
}

android {
    namespace = 'cn.inkledger.app'
    compileSdk = 37

    defaultConfig {
        applicationId = 'cn.inkledger.app'
        minSdk = 34
        targetSdk = 37
        versionCode = 1
        versionName = '1.0'
        resValue 'string', 'xiaomi_app_id', providers.gradleProperty('xiaomiAppId').getOrElse('')
        resValue 'string', 'xiaomi_island_business', providers.gradleProperty('xiaomiIslandBusiness').getOrElse('')
        manifestPlaceholders.xiaomiDebug = providers.gradleProperty('xiaomiDebug').getOrElse('false')
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
}
